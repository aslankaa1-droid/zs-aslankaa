<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Спутник наблюдает за земельным участком">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a3e"/>
      <stop offset="60%" stop-color="#2f4a64"/>
      <stop offset="100%" stop-color="#5a7d92"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8c6c"/>
      <stop offset="60%" stop-color="#3d6b50"/>
      <stop offset="100%" stop-color="#2f5d3a"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c19a3a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c19a3a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4d97a"/>
      <stop offset="70%" stop-color="#c19a3a"/>
      <stop offset="100%" stop-color="#a07f2a"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="320" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="120" cy="50" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="220" cy="80" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="350" cy="40" r="1.2" fill="#fff" opacity="0.6"/>
  <circle cx="480" cy="70" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="640" cy="55" r="1.3" fill="#fff" opacity="0.7"/>
  <circle cx="720" cy="100" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="80" cy="140" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="600" cy="130" r="1.1" fill="#fff" opacity="0.5"/>

  <!-- Sun/Moon (small disk) -->
  <circle cx="650" cy="120" r="35" fill="url(#sun)" opacity="0.9"/>
  <circle cx="650" cy="120" r="50" fill="#c19a3a" opacity="0.1"/>

  <!-- Field hills -->
  <path d="M0 320 Q 200 280 400 310 T 800 290 L 800 500 L 0 500 Z" fill="url(#field)"/>
  <path d="M0 360 Q 250 330 500 350 T 800 340 L 800 500 L 0 500 Z" fill="#3d6b50" opacity="0.5"/>

  <!-- Field stripes (perspective rows) -->
  <g stroke="#7da38a" stroke-width="1.5" opacity="0.45" fill="none">
    <path d="M-50 360 Q 350 380 850 360"/>
    <path d="M-50 380 Q 350 405 850 380"/>
    <path d="M-80 405 Q 350 430 880 405"/>
    <path d="M-100 430 Q 350 460 900 430"/>
    <path d="M-120 460 Q 350 490 920 460"/>
  </g>

  <!-- Cadastral parcel boundary (highlighted square) -->
  <g transform="translate(200 350)">
    <path d="M0 0 L 220 -10 L 240 90 L 20 100 Z" fill="#c19a3a" fill-opacity="0.18" stroke="#c19a3a" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="120" y="55" font-family="ui-monospace, monospace" font-size="11" fill="#c19a3a" text-anchor="middle" font-weight="700">69:10:0152801:425</text>
    <circle cx="0" cy="0" r="4" fill="#c19a3a"/>
    <circle cx="220" cy="-10" r="4" fill="#c19a3a"/>
    <circle cx="240" cy="90" r="4" fill="#c19a3a"/>
    <circle cx="20" cy="100" r="4" fill="#c19a3a"/>
  </g>

  <!-- Satellite (top right) -->
  <g transform="translate(550 100)">
    <!-- Solar panels -->
    <rect x="-50" y="-5" width="35" height="20" fill="#5a7d9d" stroke="#1a2a3e" stroke-width="1.5"/>
    <rect x="-50" y="-5" width="35" height="20" fill="none" stroke="#3a5d7d" stroke-width="0.5">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </rect>
    <line x1="-15" y1="-5" x2="-15" y2="15" stroke="#1a2a3e" stroke-width="1"/>
    <line x1="-32" y1="-5" x2="-32" y2="15" stroke="#1a2a3e" stroke-width="1"/>

    <rect x="20" y="-5" width="35" height="20" fill="#5a7d9d" stroke="#1a2a3e" stroke-width="1.5"/>
    <line x1="38" y1="-5" x2="38" y2="15" stroke="#1a2a3e" stroke-width="1"/>

    <!-- Body -->
    <rect x="-15" y="-12" width="35" height="34" rx="3" fill="#dcd8cc" stroke="#1a2a3e" stroke-width="1.5"/>
    <rect x="-12" y="-9" width="29" height="10" fill="#c19a3a" opacity="0.7"/>
    <circle cx="2" cy="14" r="3" fill="#c19a3a"/>

    <!-- Antenna -->
    <line x1="2" y1="-12" x2="2" y2="-22" stroke="#1a2a3e" stroke-width="2"/>
    <circle cx="2" cy="-22" r="2" fill="#c19a3a"/>
  </g>

  <!-- Scanning beam from satellite to parcel -->
  <path d="M552 122 L 270 360 L 460 350 L 552 122 Z" fill="url(#goldBeam)" opacity="0.6"/>

  <!-- Pulse beam ring on parcel -->
  <ellipse cx="320" cy="395" rx="60" ry="10" fill="none" stroke="#c19a3a" stroke-width="2" opacity="0.4">
    <animate attributeName="rx" values="40;90;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Tree silhouettes -->
  <g fill="#1f2a24" opacity="0.85">
    <ellipse cx="60" cy="345" rx="14" ry="22"/>
    <rect x="58" y="345" width="4" height="20"/>
    <ellipse cx="730" cy="335" rx="12" ry="18"/>
    <rect x="728" y="335" width="3" height="18"/>
    <ellipse cx="710" cy="338" rx="9" ry="14"/>
  </g>

  <!-- Fence posts -->
  <g stroke="#4a3a2a" stroke-width="2" fill="none" opacity="0.65">
    <line x1="100" y1="350" x2="100" y2="370"/>
    <line x1="120" y1="349" x2="120" y2="369"/>
    <line x1="140" y1="348" x2="140" y2="368"/>
    <line x1="100" y1="358" x2="160" y2="356"/>
  </g>
</svg>
