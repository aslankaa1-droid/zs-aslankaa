<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Рост проекта — путь от М1 до М12">
  <defs>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c19a3a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c19a3a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="#6b7570" stroke-width="0.5" opacity="0.15">
    <line x1="80" y1="80" x2="760" y2="80"/>
    <line x1="80" y1="160" x2="760" y2="160"/>
    <line x1="80" y1="240" x2="760" y2="240"/>
    <line x1="80" y1="320" x2="760" y2="320"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="380" x2="760" y2="380" stroke="#1f2a24" stroke-width="2"/>
  <line x1="80" y1="380" x2="80" y2="60" stroke="#1f2a24" stroke-width="2"/>

  <!-- Y axis labels -->
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#6b7570" text-anchor="end">
    <text x="70" y="84">5 000</text>
    <text x="70" y="164">3 000</text>
    <text x="70" y="244">1 000</text>
    <text x="70" y="324">200</text>
    <text x="70" y="384">0</text>
  </g>
  <text x="40" y="220" font-family="-apple-system, sans-serif" font-size="11" fill="#6b7570" font-weight="600" transform="rotate(-90 40 220)">пользователей</text>

  <!-- X axis labels (months M1, M3, M6, M9, M12) -->
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#6b7570" text-anchor="middle">
    <text x="120" y="400">М1</text>
    <text x="240" y="400">М3</text>
    <text x="380" y="400">М6</text>
    <text x="520" y="400">М9</text>
    <text x="700" y="400">М12</text>
  </g>

  <!-- Growth curve area -->
  <path d="M 120 370 Q 220 365 300 350 Q 380 330 460 290 Q 540 240 620 180 Q 680 130 700 100 L 700 380 L 120 380 Z"
        fill="url(#curveFill)"/>

  <!-- Growth curve line -->
  <path d="M 120 370 Q 220 365 300 350 Q 380 330 460 290 Q 540 240 620 180 Q 680 130 700 100"
        fill="none" stroke="#c19a3a" stroke-width="3.5"/>

  <!-- Milestone dots with labels -->
  <g>
    <!-- M1 — start -->
    <circle cx="120" cy="370" r="6" fill="#c19a3a" stroke="#fff" stroke-width="2"/>
    <g transform="translate(120 350)">
      <rect x="-30" y="-20" width="60" height="22" rx="4" fill="#1f2a24"/>
      <text x="0" y="-5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff">200</text>
    </g>

    <!-- M6 — pilot -->
    <circle cx="380" cy="330" r="8" fill="#2f5d3a" stroke="#fff" stroke-width="3"/>
    <g transform="translate(380 305)">
      <rect x="-40" y="-22" width="80" height="24" rx="4" fill="#2f5d3a"/>
      <text x="0" y="-6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff">М6 пилот</text>
    </g>
    <text x="380" y="425" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#1f2a24" font-weight="600">Тверская обл.</text>

    <!-- M11 — UZ-2 -->
    <circle cx="640" cy="170" r="7" fill="#c19a3a" stroke="#fff" stroke-width="2"/>
    <g transform="translate(640 142)">
      <rect x="-40" y="-22" width="80" height="24" rx="4" fill="#c19a3a"/>
      <text x="0" y="-6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#1f2a24">УЗ-2 ФСТЭК</text>
    </g>

    <!-- M12 — final -->
    <circle cx="700" cy="100" r="9" fill="#2f5d3a" stroke="#fff" stroke-width="3"/>
    <g transform="translate(700 70)">
      <rect x="-50" y="-24" width="100" height="26" rx="5" fill="#2f5d3a"/>
      <text x="0" y="-7" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fff">5 000 чел.</text>
    </g>
    <text x="700" y="425" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#1f2a24" font-weight="600">7 регионов</text>
  </g>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#1f2a24">Целевой рост — 12 месяцев</text>

  <!-- Annotations -->
  <g font-family="-apple-system, sans-serif" font-size="10" fill="#6b7570">
    <text x="200" y="200">Подготовка</text>
    <text x="500" y="240">Расширение</text>
  </g>
</svg>
