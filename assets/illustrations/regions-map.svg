<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Карта 7 регионов московского кластера">
  <defs>
    <radialGradient id="moscowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c19a3a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c19a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="transparent"/>

  <!-- Subtle grid -->
  <g stroke="#6b7570" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Region polygons (схематичные, не геопроекция) -->
  <!-- Тверская (NW) -->
  <path d="M 80 80 L 240 70 L 280 140 L 250 200 L 180 220 L 100 190 L 70 130 Z"
        fill="#2f5d3a" fill-opacity="0.18" stroke="#2f5d3a" stroke-width="2"/>

  <!-- Ярославская (NE) -->
  <path d="M 320 60 L 470 65 L 510 130 L 480 190 L 410 200 L 340 170 L 320 100 Z"
        fill="#c19a3a" fill-opacity="0.25" stroke="#c19a3a" stroke-width="2"/>

  <!-- Владимирская (E) -->
  <path d="M 540 170 L 700 165 L 730 230 L 690 280 L 600 285 L 530 245 Z"
        fill="#2f5d3a" fill-opacity="0.13" stroke="#2f5d3a" stroke-width="2"/>

  <!-- Рязанская (SE) -->
  <path d="M 480 320 L 640 315 L 680 380 L 630 430 L 540 430 L 480 380 Z"
        fill="#2f5d3a" fill-opacity="0.13" stroke="#2f5d3a" stroke-width="2"/>

  <!-- Калужская (SW) -->
  <path d="M 80 290 L 220 285 L 250 350 L 220 410 L 140 420 L 80 380 Z"
        fill="#2f5d3a" fill-opacity="0.13" stroke="#2f5d3a" stroke-width="2"/>

  <!-- Смоленская (W) -->
  <path d="M 100 220 L 250 215 L 270 280 L 240 320 L 160 320 L 90 280 Z"
        fill="#2f5d3a" fill-opacity="0.13" stroke="#2f5d3a" stroke-width="2"/>

  <!-- Московская обл. + Москва (центр) -->
  <circle cx="380" cy="270" r="100" fill="url(#moscowGlow)"/>
  <path d="M 290 230 L 460 220 L 480 290 L 430 340 L 340 340 L 280 290 Z"
        fill="#2f5d3a" fill-opacity="0.20" stroke="#2f5d3a" stroke-width="2.5"/>

  <!-- Moscow city dot -->
  <circle cx="380" cy="270" r="12" fill="#c19a3a"/>
  <circle cx="380" cy="270" r="6" fill="#fff"/>
  <circle cx="380" cy="270" r="20" fill="none" stroke="#c19a3a" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="20;40;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Region labels -->
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2a24">
    <text x="170" y="150" text-anchor="middle">Тверская</text>
    <text x="170" y="166" text-anchor="middle" font-size="10" fill="#2f5d3a">Стартовый пилот</text>

    <text x="410" y="135" text-anchor="middle">Ярославская</text>
    <text x="410" y="151" text-anchor="middle" font-size="10" fill="#c19a3a">110 тыс ₽/га</text>

    <text x="620" y="225" text-anchor="middle">Владимирская</text>

    <text x="580" y="380" text-anchor="middle">Рязанская</text>

    <text x="160" y="360" text-anchor="middle">Калужская</text>
    <text x="160" y="376" text-anchor="middle" font-size="10" fill="#b85d1a">Минэкономразвития</text>

    <text x="170" y="270" text-anchor="middle">Смоленская</text>

    <text x="380" y="295" text-anchor="middle" font-weight="700" font-size="14">Московская</text>
    <text x="380" y="312" text-anchor="middle" font-size="10" fill="#1f2a24" opacity="0.7">+ Москва</text>
  </g>

  <!-- Compass rose (top right) -->
  <g transform="translate(740 60)" stroke="#1f2a24" stroke-width="1" fill="none">
    <circle cx="0" cy="0" r="20" stroke-opacity="0.3"/>
    <path d="M 0 -22 L 4 -2 L 0 0 L -4 -2 Z" fill="#c19a3a" stroke="#c19a3a"/>
    <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#1f2a24" font-family="sans-serif" font-weight="700" stroke="none">С</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40 450)" font-family="-apple-system, sans-serif" font-size="11">
    <rect x="0" y="0" width="14" height="10" fill="#c19a3a" fill-opacity="0.25" stroke="#c19a3a" stroke-width="1.5"/>
    <text x="20" y="9" fill="#1f2a24">Высшая субсидия S-1</text>
    <rect x="190" y="0" width="14" height="10" fill="#2f5d3a" fill-opacity="0.20" stroke="#2f5d3a" stroke-width="1.5"/>
    <text x="210" y="9" fill="#1f2a24">Стандартный охват</text>
    <circle cx="406" cy="5" r="6" fill="#c19a3a"/>
    <text x="418" y="9" fill="#1f2a24">Москва — центр кластера</text>
  </g>
</svg>
